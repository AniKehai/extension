name: anikehai

x-ci-build: &ci-build
  context: .
  target: ci

x-env: &env # Linux only (optional): chown generated files back
  HOST_UID: ${HOST_UID:-}
  HOST_GID: ${HOST_GID:-}
  PLAYWRIGHT_HTML_OPEN: never

# more shared memory for chromium
x-browser: &browser
  init: true
  shm_size: 1gb

x-dev: &dev
  build:
    context: .
    target: dev
  image: anikehai-dev
  init: true
  profiles: [dev]
  working_dir: /app
  ports:
    - "3000:3000"
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - bun_cache:/root/.bun/install/cache
  environment:
    <<: *env
    CHOKIDAR_USEPOLLING: "1"
    CHOKIDAR_INTERVAL: "400"

services:
  dev:
    <<: *dev
    command: ["bunx", "wxt", "-c", "wxt.docker.config.ts", "-b", "chrome"]

  dev-firefox:
    <<: *dev
    command: ["bunx", "wxt", "-c", "wxt.docker.config.ts", "-b", "firefox"]

  dev-edge:
    <<: *dev
    command: ["bunx", "wxt", "-c", "wxt.docker.config.ts", "-b", "edge"]

  shell:
    <<: *dev
    ports: []
    command: ["bash"]
    stdin_open: true
    tty: true

  lint:
    build: *ci-build
    image: anikehai-ci
    profiles: [ci]
    init: true
    environment: *env
    command: ["sh", "-c", "bun run lint && bun run typecheck"]

  test:
    build: *ci-build
    image: anikehai-ci
    profiles: [ci]
    init: true
    environment: *env
    volumes:
      - ./coverage:/app/coverage
    command: ["bun", "run", "test:coverage"]

  build:
    build: *ci-build
    image: anikehai-ci
    profiles: [ci]
    init: true
    environment: *env
    volumes:
      - ./.output:/app/.output
    command:
      [
        "sh",
        "-c",
        "bun run zip:chrome && bun run zip:firefox && bun run zip:edge",
      ]

  e2e:
    <<: *browser
    build: *ci-build
    image: anikehai-ci
    profiles: [ci]
    environment: *env
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    command:
      [
        "sh",
        "-c",
        "bunx wxt build && bunx playwright test --reporter=list,html",
      ]

  health:
    <<: *browser
    build: *ci-build
    image: anikehai-ci
    profiles: [ci]
    environment:
      <<: *env
      PLAYWRIGHT_HTML_REPORT: playwright-report/health
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    command:
      - sh
      - -c
      - bunx playwright test --config=playwright.health.config.ts --reporter=list,html

  ci:
    <<: *browser
    build: *ci-build
    image: anikehai-ci
    profiles: [ci]
    environment: *env
    volumes:
      - ./coverage:/app/coverage
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    command:
      - sh
      - -c
      - >-
        bun run lint
        && bun run typecheck
        && bun run test:coverage
        && bunx wxt build
        && bunx playwright test --reporter=list,html

volumes:
  node_modules:
  bun_cache:
