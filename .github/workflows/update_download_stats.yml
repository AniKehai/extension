name: Stats
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    name: Update download stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.ADMIN_PAT }}"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Update README with download counts
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPO: "${{ github.repository }}"
          FIREFOX_ADDON_SLUG: anikehai
        run: bun scripts/count_downloads.ts
      - name: Commit changes
        run: >
          git config user.name "github-actions[bot]"

          git config user.email
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || (git commit -m "chore: update download
          stats [skip ci]" && git pull --rebase && git push)
