name: Docker
on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker/**
      - wxt.docker.config.ts
      - package.json
      - bun.lock
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker/**
      - wxt.docker.config.ts
      - package.json
      - bun.lock
      - .github/workflows/docker.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  docker:
    name: "Lint, tests and E2E in containers"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Validate docker-compose.yml
        run: docker compose --profile dev --profile ci config --quiet
      - name: "Run lint, typecheck, tests and E2E"
        run: >
          # Hand generated files back to the runner user so the artifact upload
          can read them.

          export HOST_UID="$(id -u)" HOST_GID="$(id -g)"

          docker compose run --rm --build ci
      - name: Run the production build
        run: |
          export HOST_UID="$(id -u)" HOST_GID="$(id -g)"
          docker compose run --rm build
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-reports
          path: |
            coverage/
            playwright-report/
            test-results/
            .output/*.zip
          if-no-files-found: ignore
