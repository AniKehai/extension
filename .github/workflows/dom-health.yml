name: Live DOM Health Check
on:
  schedule:
    - cron: "0 0 * * 0,3"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health-check:
    name: Check Live Site Selectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: "bun run test:e2e:install"
      - name: Run Live Health Checks
        run: "bun run test:health"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-playwright-report
          path: |
            playwright-report/
            test-results/
            if-no-files-found: ignore
      - name: Notify on Failure
        if: failure()
        run: >
          echo "::error::One or more site selectors have broken in production.
          Check the Playwright report."
